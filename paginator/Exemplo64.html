<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<!-- Bootstrap CSS -->
	<link href="css/bootstrap.min.css" rel="stylesheet">
	<title>Bootstrap</title>
</head>
<body>
	<!-- usando o container fluid -->
	<div class="container-fluid">
		<div class="row">
			<div class="col-12">
				<div class="card" style="width: 20rem">
					<img src="imagem/suave.jpg"  class="card-img-top">
					<div class="card-body">
						<h4 class="card-title">Título do Cartão</h4>
						<h6 class="card-subtitle text-muted">Subtítulo do cartão</h6>
						<p class="card-text">
							Esse é o texto do meu cartão.
						</p>
						<a href="https://www.google.com.br/" class="card-link">Ir para o Google</a>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- jQuery, Popper.js, Bootstrap JS -->	
	<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
	<script src="js/bootstrap.min.js"></script>
</body>
</html>
